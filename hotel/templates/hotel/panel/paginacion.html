{% if pagina.has_other_pages %}<nav class="pagination" aria-label="Páginas">{% if pagina.has_previous %}<a href="?q={{ q|urlencode }}&amp;estado={{ estado|urlencode }}&amp;page={{ pagina.previous_page_number }}">← Anterior</a>{% endif %}<span>Página {{ pagina.number }} de {{ pagina.paginator.num_pages }}</span>{% if pagina.has_next %}<a href="?q={{ q|urlencode }}&amp;estado={{ estado|urlencode }}&amp;page={{ pagina.next_page_number }}">Siguiente →</a>{% endif %}</nav>{% endif %}
